name: build

on:
  workflow_dispatch:          # run manually from the Actions tab (build only)
  push:
    tags: ["v*"]              # tagging a commit builds AND publishes to the GlueX index

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build rucio-clients-gluex
        run: uv run --python 3.11 scripts/build.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rucio-clients-gluex
          path: dist/*
          if-no-files-found: error

      - name: Publish to GlueX PyPI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Repo -> Settings -> Secrets and variables -> Actions
          UV_PUBLISH_URL: ${{ vars.GLUEX_PYPI_PUBLISH_URL }}      # variable: upload endpoint
          UV_PUBLISH_TOKEN: ${{ secrets.GLUEX_PYPI_TOKEN }}   # secret (the password or token value)
        run: uv publish
